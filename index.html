    <style>
      /* Reset and full screen styles */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        font-family: 'Cairo', sans-serif;
      }
      
      #root {
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
      }
      
      /* App container styles */
      .app-container {
        width: 100%;
        height: 100%;
        max-width: 100vw;
        max-height: 100vh;
        overflow-x: hidden;
        overflow-y: auto;
      }
      
      @keyframes slideInUp {
        from {
          transform: scale(0.95) translateY(10px);
          opacity: 0;
        }
        to {
          transform: scale(1) translateY(0);
          opacity: 1;
        }
      }
      .animate-slide-in-up {
        animation: slideInUp 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      }
      @keyframes fall {
        0% {
          transform: translateY(-100px) rotateZ(0deg);
          opacity: 0;
        }
        10% {
          opacity: 0.8;
        }
        100% {
          transform: translateY(calc(100vh + 100px)) rotateZ(360deg);
          opacity: 0;
        }
      }
      .rain-drop {
        position: absolute;
        top: -100px;
        width: 40px;
        height: 40px;
        animation-name: fall;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
      }
      @keyframes fadeInOut {
        0%, 100% {
          opacity: 0.7;
          transform: scale(0.98);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }
      .animate-fade-in-out {
        animation: fadeInOut 3s ease-in-out infinite;
      }
    </style>
